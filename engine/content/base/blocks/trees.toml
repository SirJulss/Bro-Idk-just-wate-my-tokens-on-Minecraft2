# Logs, planks and leaves of the four tree species.
#
# A log lies along one of the three axes (`axis3`): its end grain shows on both faces of that
# axis and the bark on the other four. Logs are `structural`, so a trunk is kept when coarser
# levels are derived instead of vanishing at a distance. Leaves are cut-out blocks: solid, but
# not opaque; all species share the cull group `leaves`, so no faces are drawn inside a
# canopy, not even where two species meet.

# --- oak --------------------------------------------------------------------------------------

[[block]]
key = "cubeplanet:log_oak"
orient = "axis3"
structural = true
hardness = 3.0
density = 750.0
tags = ["log", "oak", "wood"]
[block.faces]
top = "cubeplanet:log_oak_top"
side = "cubeplanet:log_oak_side"
bottom = "cubeplanet:log_oak_top"

[[block]]
key = "cubeplanet:planks_oak"
faces = { all = "cubeplanet:planks_oak" }
hardness = 2.5
density = 750.0
tags = ["oak", "planks", "wood"]

[[block]]
key = "cubeplanet:leaves_oak"
render = "cutout"
cull_group = "leaves"
faces = { all = "cubeplanet:leaves_oak" }
hardness = 0.3
density = 150.0
tags = ["leaves", "oak"]

