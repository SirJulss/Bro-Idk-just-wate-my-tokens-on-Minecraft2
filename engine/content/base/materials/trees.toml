# Tree materials: bark, end grain, planks and leaves of the four species.
#
# Oak leaves take the foliage colour of the place they grow in (`tint = "foliage"`; their
# texture is painted near-neutral for that). Birch, spruce and cherry carry their own colour in
# the texture and are not tinted, so they look the same in every climate.

# --- oak --------------------------------------------------------------------------------------

[[material]]
key = "cubeplanet:log_oak_side"
texture = "cubeplanet:log_oak_side"

[[material]]
key = "cubeplanet:log_oak_top"
texture = "cubeplanet:log_oak_top"

[[material]]
key = "cubeplanet:planks_oak"
texture = "cubeplanet:planks_oak"

[[material]]
key = "cubeplanet:leaves_oak"
texture = "cubeplanet:leaves_oak"
tint = "foliage"
flags = ["cutout"]

