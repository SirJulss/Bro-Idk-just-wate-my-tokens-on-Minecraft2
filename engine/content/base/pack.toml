# Cubeplanet base content pack.
#
# Own content only: every texture here is generated by a cp-proctex recipe and is marked
# `provenance = "own"`. Third-party art never goes into this pack.
#
# Layout (the format is documented in crates/cp-content/src/lib.rs):
#   textures/*.toml    [[texture]]   where the pixels come from
#   materials/*.toml   [[material]]  how a surface looks; names a texture
#   blocks/*.toml      [[block]]     what fills a cell; names a material per face
#
# Keys are `namespace:name`. Blocks, materials and textures have separate key spaces, so the
# block `cubeplanet:stone` uses the material `cubeplanet:stone`, which uses the texture
# `cubeplanet:stone`.

format = 1
name = "base"
version = "0.1.0"
description = "Cubeplanet base content: terrain, trees, fluids and ores of the home system."
